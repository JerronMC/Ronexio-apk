name: Build Ronexio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Ronexio-Android-Project*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Ronexio project ZIP
        shell: bash
        run: |
          shopt -s nullglob
          archives=(Ronexio-Android-Project*.zip)
          if (( ${#archives[@]} == 0 )); then
            echo 'ERROR: No Ronexio-Android-Project*.zip found in the repository root.'
            echo 'Upload the Android project ZIP to the top level of this repository.'
            echo 'Repository files:'
            ls -la
            exit 1
          fi
          archive="${archives[0]}"
          echo "Using project archive: $archive"
          unzip -q "$archive" -d source
          project_file="$(find source -type f -name settings.gradle -print -quit)"
          if [[ -z "$project_file" ]]; then
            echo 'ERROR: settings.gradle was not found inside the ZIP.'
            find source -maxdepth 4 -type f -print
            exit 1
          fi
          project_dir="$(dirname "$project_file")"
          echo "RONEXIO_PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Found Android project at: $project_dir"

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace -p "$RONEXIO_PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ronexio-debug-apk
          path: ${{ env.RONEXIO_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build Ronexio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Ronexio-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Ronexio project
        run: |
          unzip -q Ronexio-Android-Project.zip -d source
          test -f source/Ronexio/settings.gradle

      - name: Build debug APK
        working-directory: source/Ronexio
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ronexio-debug-apk
          path: source/Ronexio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
